<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurer les nuits</title>
    <link rel="stylesheet" href="style.css" />
<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background-color: #f9f9f9;
        margin: 0;
        padding: 20px;
    }

    h1,
    h2 {
        text-align: center;
        color: #333;
    }

    form {
        max-width: 500px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    label {
        font-weight: 500;
        margin-top: 10px;
        color: #444;
    }

    input[type="number"] {
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 16px;
    }

    button {
        padding: 10px;
        font-size: 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 10px;
        transition: background 0.3s ease;
    }

    #saveBtn {
        background-color: #2ecc71;
        color: white;
    }

    #saveBtn:hover {
        background-color: #27ae60;
    }

    #resetBtn {
        background-color: #e74c3c;
        color: white;
    }

    #resetBtn:hover {
        background-color: #c0392b;
    }

    #status {
        text-align: center;
        margin-top: 15px;
        font-weight: bold;
        color: #2c3e50;
    }
    .button-container {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 20px;
    }

    @media (max-width: 600px) {
        body {
            padding: 10px;
        }

        form {
            width: 100%;
        }

        input,
        button {
            font-size: 16px;
        }
    }
</style>
</head>
<a href="index.html">⬅️ Retour au calculateur</a>
<form id="configForm"></form>
<div class="button-container">
<button id="saveBtn">Enregistrer</button>
<button id="resetBtn" style="margin-top: 10px; background-color: #e74c3c; color: white;">
    Réinitialiser les données
</button>
</div>

<p id="status"></p>

<script src="config.js"></script>
